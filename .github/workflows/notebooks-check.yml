name: Verify Notebooks Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-jupytext-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify paired notebooks are in sync
        run: |
          uv run jupytext --sync experiments/**/experiment_*.py
          git diff --exit-code
